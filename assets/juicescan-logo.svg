<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" width="1180" height="320">
  <title>JuiceScan</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1C2432"/>
      <stop offset="0.5"  stop-color="#0E131C"/>
      <stop offset="1"    stop-color="#060910"/>
    </linearGradient>

    <!-- Glut um den Balken, oben laenger als unten: er kommt von oben -->
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FF8A12" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#FFA82C" stop-opacity="0.7"/>
      <stop offset="0.78" stop-color="#FF9016" stop-opacity="0.34"/>
      <stop offset="1"    stop-color="#FF7A00" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFBE4A"/>
      <stop offset="0.40" stop-color="#FFF7E2"/>
      <stop offset="0.60" stop-color="#FFF7E2"/>
      <stop offset="1"    stop-color="#FF8E0C"/>
    </linearGradient>

    <!-- Balken laeuft zu den Raendern hin aus, statt hart abzuschneiden -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.09" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.91" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgefade">
      <rect x="100" y="100" width="824" height="824" fill="url(#fade)"/>
    </mask>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8E9BB4" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8E9BB4" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#FFB04A" stop-opacity="0.30"/>
    </linearGradient>

    <filter id="soft"  x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="40"/></filter>
    <filter id="tight" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8"/></filter>
    <filter id="trail1" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5"/></filter>
    <filter id="trail2" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/></filter>
    <filter id="trail3" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/></filter>

    <clipPath id="glass">
      <rect x="100" y="100" width="824" height="824" rx="184" ry="184"/>
    </clipPath>
  </defs>
  <g transform="translate(16,16) scale(0.28125)">
<rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#plate)"/>

  <g clip-path="url(#glass)">
    <g mask="url(#edgefade)">
      <!-- weite Glut -->
      <rect x="140" y="386" width="744" height="340" fill="url(#glow)" filter="url(#soft)"/>
      <!-- enge Glut -->
      <rect x="176" y="536" width="672" height="112" fill="url(#glow)" filter="url(#tight)"/>

      <!-- Bewegungsspur: der Balken kommt von oben -->
      <rect x="186" y="424" width="652" height="9"  rx="4" fill="#FF9A1E" opacity="0.22" filter="url(#trail3)"/>
      <rect x="186" y="466" width="652" height="12" rx="6" fill="#FFB544" opacity="0.34" filter="url(#trail2)"/>
      <rect x="186" y="509" width="652" height="16" rx="8" fill="#FFD183" opacity="0.52" filter="url(#trail1)"/>

      <!-- der Balken -->
      <rect x="186" y="561" width="652" height="42" rx="21" ry="21" fill="url(#bar)"/>
      <rect x="196" y="574" width="632" height="16" rx="8"  ry="8"  fill="#FFFEFA" opacity="0.95"/>
    </g>
  </g>

  <rect x="100" y="100" width="824" height="824" rx="184" ry="184"
        fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
     font-size="132" letter-spacing="-4">
    <text x="352" y="207" fill="#FFA51F">Juice</text>
    <text x="352" y="207" fill="#EDF1F7" dx="0">
      <tspan fill="transparent">Juice</tspan><tspan fill="#EDF1F7">Scan</tspan>
    </text>
  </g>
  <text x="356" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="500" font-size="30" letter-spacing="5.5" fill="#7F8CA3">OLD SCANNERS, NEW DRIVERS</text>
</svg>
